[package]
name = "adb-studio"
version = "0.1.0"
edition = "2021"
build = "build.rs"
authors = ["Alexandre Dupuis-Belin"]
description = "A cross-platform workspace for organizing and annotating generated audio."

[dependencies]
display-info = "0.5"
dirs = "6"
include_dir = "0.7"
image = "0.25"
filetime = "0.2"
lucide-icons = "1.41"
notify = "6"
opener = { version = "0.8", features = ["reveal"] }
rfd = "0.15"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.9"
trash = "5"
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3", "ogg", "vorbis", "wav"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "vorbis", "wav"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

[build-dependencies]
slint-build = "1.9"
